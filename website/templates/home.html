{% extends "base.html" %} {% block title %}Home{% endblock %} {% block content
%}
<h1 align="center">Home</h1>
<ul class="list-group list-group-flush" id="notes">
  
</ul>
<form method="POST">
  <h3 align="center">Request a Course</h3>
  <div class="form-group">
    <label for="student_id">Student ID</label>
    <input
      type="text"
      class="form-control"
      id="student_id"
      name="student_id"
      placeholder="Enter student id"
    />
  </div>
  <div class="form-group">
    <label for="student_name">Student Name</label>
    <input
      type="text"
      class="form-control"
      id="student_name"
      name="student_name"
      placeholder="Enter name"
    />
  </div>
  <div class="form-group">
    <label for="course_name">Course Name</label>
    <input
      type="text"
      class="form-control"
      id="course_name"
      name="course_name"
      placeholder="Enter course name"
    />
  </div>
  <div class="form-group">
    <label for="course_id">Course ID</label>
    <input
      type="text"
      class="form-control"
      id="course_id"
      name="course_id"
      placeholder="Enter course id"
    />
  </div>
  <div class="form-group">
    <label for="course_id">Justification</label>
    <textarea name="justification" id="justification" class="form-control" placeholder="State reasoning here"></textarea>
  </div>
  <br />
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
{% endblock %}
